# FediBoard - Cloudflare Worker 설정
# 배포 주소: https://starship.eeruwang.workers.dev/
name = "starship"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# 정적 파일 서빙 설정
# public/ 디렉토리의 파일을 자동으로 서빙합니다.
[assets]
directory = "./public"

# 커스텀 도메인 사용 시 아래 주석 해제
# [routes]
# pattern = "fediboard.example.com/*"
# zone_name = "example.com"

# D1 데이터베이스 (회원/설정 저장)
[[d1_databases]]
binding = "FEDI_ACCOUNTS"
database_name = "fedi-accounts"
database_id = "01f5e825-6777-4b3e-8716-2c02fe91555a"

# Cloudflare Turnstile (회원가입 인간 확인)
# 대시보드 > Turnstile에서 키 생성 후 아래에 입력
# TURNSTILE_SECRET은 wrangler secret으로 설정: wrangler secret put TURNSTILE_SECRET
[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAACZUfwlrZqv0UjBX"

# Durable Objects (WebSocket 스트림 릴레이)
[durable_objects]
bindings = [
  { name = "STREAM_RELAY", class_name = "StreamRelay" }
]

[[migrations]]
tag = "v1"
new_classes = ["StreamRelay"]

# R2 이미지 캐시 (아바타, 미디어, 이모지)
[[r2_buckets]]
binding = "STARSHIP_CACHE"
bucket_name = "starship-cache"
