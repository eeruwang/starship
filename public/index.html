<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarShip - Fediverse Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-root">
    <header class="app-header">
      <div class="header-left">
        <h1 class="logo">StarShip</h1>
        <span class="tagline">Fediverse Multi-Account Dashboard</span>
      </div>
      <div class="header-right">
        <button id="btn-add-account" class="btn btn-primary">+ 계정 추가</button>
        <button id="btn-refresh-all" class="btn btn-secondary">새로고침</button>
        <button id="btn-settings" class="btn btn-icon" title="설정">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <nav class="column-toggle-bar" id="column-toggle-bar"></nav>

    <main class="dashboard" id="dashboard">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">🌐</div>
        <h2>Fediverse 계정을 연결하세요</h2>
        <p>Misskey, Iceshrimp, CherryPick, Mastodon 계정을 추가하여<br>모든 타임라인을 한 곳에서 확인하세요.</p>
        <button class="btn btn-primary btn-large" id="btn-add-first">계정 추가하기</button>
      </div>

      <div class="columns-container" id="columns-container" style="display:none;"></div>
    </main>
  </div>

  <!-- 계정 추가 모달 -->
  <div class="modal-overlay" id="modal-add-account" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h2>계정 추가</h2>
        <button class="btn btn-icon modal-close" data-close-modal="modal-add-account"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="platform-select" value="">
        <div class="form-group">
          <label for="instance-url">인스턴스 주소</label>
          <input type="text" id="instance-url" class="input" placeholder="misskey.io">
          <small class="form-hint">예: misskey.io, mastodon.social (https:// 생략 가능)</small>
          <div id="detected-platform" class="detected-platform" style="display:none;"></div>
        </div>

        <!-- OAuth 로그인 (기본) -->
        <div id="oauth-section">
          <button class="btn btn-primary btn-large" id="btn-oauth-login" style="width:100%; margin-top:0.5rem;">
            로그인으로 연결
          </button>
          <small class="form-hint" style="text-align:center; display:block; margin-top:0.5rem;">
            인스턴스 로그인 페이지에서 권한을 승인합니다.
          </small>
        </div>

        <!-- 수동 토큰 입력 (접이식) -->
        <details id="manual-token-section" style="margin-top:1rem;">
          <summary style="cursor:pointer; color:var(--text-muted); font-size:0.85rem;">
            수동으로 액세스 토큰 입력
          </summary>
          <div style="margin-top:0.75rem;">
            <div class="form-group">
              <label for="access-token">액세스 토큰</label>
              <input type="password" id="access-token" class="input" placeholder="액세스 토큰을 입력하세요">
              <small class="form-hint" id="token-hint">인스턴스 설정에서 API 토큰을 생성하세요.</small>
            </div>
            <div class="form-group">
              <label for="account-label">표시 이름 (선택)</label>
              <input type="text" id="account-label" class="input" placeholder="내 미스키 계정">
            </div>
          </div>
        </details>

        <div id="add-account-error" class="form-error" style="display:none;"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close-modal="modal-add-account">취소</button>
        <button class="btn btn-primary" id="btn-confirm-add">수동 토큰으로 추가</button>
      </div>
    </div>
  </div>

  <!-- 새 글 작성 모달 -->
  <div class="modal-overlay" id="modal-compose" style="display:none;">
    <div class="modal compose-modal">
      <div class="modal-header">
        <h2 id="compose-title">새 글 작성</h2>
        <button class="btn btn-icon modal-close" data-close-modal="modal-compose"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>게시 계정</label>
          <div class="compose-accounts" id="compose-accounts"></div>
        </div>
        <div class="form-group">
          <input type="text" id="compose-cw" class="input" placeholder="내용 경고 (선택)">
        </div>
        <div class="form-group">
          <textarea id="compose-text" class="input compose-textarea" rows="5" placeholder="무슨 일이 일어나고 있나요?"></textarea>
        </div>
        <div class="compose-bottom-bar">
          <input type="file" id="compose-files" accept="image/*" multiple style="display:none;">
          <button class="btn btn-icon" id="btn-compose-attach" title="이미지 첨부">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          </button>
          <div class="compose-char-hint" id="compose-char-hint"></div>
          <button class="btn btn-primary" id="btn-compose-submit">게시</button>
        </div>
        <div class="compose-image-preview" id="compose-image-preview"></div>
        <div id="compose-error" class="form-error" style="display:none;"></div>
      </div>
    </div>
  </div>

  <!-- 설정 모달 -->
  <div class="modal-overlay" id="modal-settings" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h2>설정</h2>
        <button class="btn btn-icon modal-close" data-close-modal="modal-settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="setting-refresh-interval">자동 새로고침 간격</label>
          <select id="setting-refresh-interval" class="input">
            <option value="0">끄기</option>
            <option value="30000">30초</option>
            <option value="60000" selected>1분</option>
            <option value="120000">2분</option>
            <option value="300000">5분</option>
          </select>
        </div>
        <div class="form-group">
          <label for="setting-column-width">컬럼 너비</label>
          <select id="setting-column-width" class="input">
            <option value="320">좁게 (320px)</option>
            <option value="380" selected>보통 (380px)</option>
            <option value="440">넓게 (440px)</option>
            <option value="520">아주 넓게 (520px)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="setting-font-size">글꼴 크기</label>
          <select id="setting-font-size" class="input">
            <option value="13">작게 (13px)</option>
            <option value="14" selected>보통 (14px)</option>
            <option value="15">크게 (15px)</option>
            <option value="16">아주 크게 (16px)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="setting-posts-count">타임라인 로드 개수</label>
          <select id="setting-posts-count" class="input">
            <option value="20">20개</option>
            <option value="30" selected>30개</option>
            <option value="50">50개</option>
          </select>
        </div>
        <hr style="border:none; border-top:1px solid var(--border-color); margin:1rem 0;">
        <button class="btn btn-danger btn-small" id="btn-settings-reset" style="width:100%;">모든 데이터 초기화</button>
        <small class="form-hint" style="text-align:center; display:block; margin-top:0.3rem;">계정 정보와 설정이 모두 삭제됩니다.</small>
      </div>
    </div>
  </div>

  <!-- 이미지 라이트박스 -->
  <div class="lightbox-overlay" id="lightbox" style="display:none;">
    <button class="lightbox-close" id="lightbox-close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <img id="lightbox-img" src="" alt="">
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
