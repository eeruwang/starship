<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarShip - Fediverse Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <h1 class="logo">StarShip</h1>
      <span class="tagline">Fediverse Multi-Account Dashboard</span>
    </div>
    <div class="header-right">
      <button id="btn-compose" class="btn btn-primary" title="새 글 작성">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        새 글
      </button>
      <button id="btn-add-column" class="btn btn-secondary" title="컬럼 추가">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        컬럼
      </button>
      <button id="btn-add-account" class="btn btn-secondary">+ 계정 추가</button>
      <button id="btn-refresh-all" class="btn btn-icon" title="새로고침">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
    </div>
  </header>

  <nav class="account-tabs" id="account-tabs">
    <button class="tab active" data-tab="all">전체</button>
  </nav>

  <main class="dashboard" id="dashboard">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--accent-primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      </div>
      <h2>Fediverse 계정을 연결하세요</h2>
      <p>Misskey, Iceshrimp, CherryPick, Mastodon 계정을 추가하여<br>모든 타임라인을 한 곳에서 확인하세요.</p>
      <button class="btn btn-primary btn-large" id="btn-add-first">계정 추가하기</button>
    </div>

    <div class="columns-container" id="columns-container" style="display:none;">
      <!-- Dynamic columns are created by JS -->
    </div>
  </main>

  <!-- 계정 추가 모달 -->
  <div class="modal-overlay" id="modal-add-account" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h2>계정 추가</h2>
        <button class="btn btn-icon modal-close" data-close-modal="modal-add-account">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="platform-select">플랫폼</label>
          <select id="platform-select" class="input">
            <option value="">선택하세요</option>
            <option value="misskey">Misskey (오리지널)</option>
            <option value="iceshrimp">Iceshrimp</option>
            <option value="cherrypick">CherryPick</option>
            <option value="mastodon">Mastodon</option>
          </select>
        </div>
        <div class="form-group">
          <label for="instance-url">인스턴스 URL</label>
          <input type="url" id="instance-url" class="input" placeholder="https://misskey.io">
          <small class="form-hint">예: https://misskey.io, https://mastodon.social</small>
        </div>

        <!-- OAuth 로그인 (기본) -->
        <div id="oauth-section">
          <button class="btn btn-primary btn-large" id="btn-oauth-login" style="width:100%; margin-top:0.5rem;">
            로그인으로 연결
          </button>
          <small class="form-hint" style="text-align:center; display:block; margin-top:0.5rem;">
            인스턴스 로그인 페이지에서 권한을 승인합니다.
          </small>
        </div>

        <!-- 수동 토큰 입력 (접이식) -->
        <details id="manual-token-section" style="margin-top:1rem;">
          <summary style="cursor:pointer; color:var(--text-muted); font-size:0.85rem;">
            수동으로 액세스 토큰 입력
          </summary>
          <div style="margin-top:0.75rem;">
            <div class="form-group">
              <label for="access-token">액세스 토큰</label>
              <input type="password" id="access-token" class="input" placeholder="액세스 토큰을 입력하세요">
              <small class="form-hint" id="token-hint">인스턴스 설정에서 API 토큰을 생성하세요.</small>
            </div>
            <div class="form-group">
              <label for="account-label">표시 이름 (선택)</label>
              <input type="text" id="account-label" class="input" placeholder="내 미스키 계정">
            </div>
          </div>
        </details>

        <div id="add-account-error" class="form-error" style="display:none;"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close-modal="modal-add-account">취소</button>
        <button class="btn btn-primary" id="btn-confirm-add">수동 토큰으로 추가</button>
      </div>
    </div>
  </div>

  <!-- 새 글 작성 모달 -->
  <div class="modal-overlay" id="modal-compose" style="display:none;">
    <div class="modal modal-compose">
      <div class="modal-header">
        <h2>새 글 작성</h2>
        <button class="btn btn-icon modal-close" data-close-modal="modal-compose">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="compose-accounts-section">
          <label class="form-label">게시할 계정</label>
          <div class="compose-accounts" id="compose-accounts"></div>
        </div>
        <div class="form-group">
          <details class="cw-input-toggle">
            <summary>CW (내용 경고)</summary>
            <input type="text" id="compose-cw" class="input" placeholder="내용 경고 텍스트" style="margin-top:0.5rem;">
          </details>
        </div>
        <div class="form-group">
          <textarea id="compose-text" class="input compose-textarea" placeholder="무슨 일이 있나요?" rows="5"></textarea>
          <div class="compose-footer-info">
            <span class="compose-counter"><span id="compose-count">0</span>자</span>
          </div>
        </div>
        <div id="compose-error" class="form-error" style="display:none;"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close-modal="modal-compose">취소</button>
        <button class="btn btn-primary" id="btn-compose-submit">게시</button>
      </div>
    </div>
  </div>

  <!-- 컬럼 추가 모달 -->
  <div class="modal-overlay" id="modal-add-column" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h2>컬럼 추가</h2>
        <button class="btn btn-icon modal-close" data-close-modal="modal-add-column">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <!-- Populated dynamically -->
      </div>
    </div>
  </div>

  <!-- 게시물 상세 모달 -->
  <div class="modal-overlay" id="modal-post-detail" style="display:none;">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h2>게시물 상세</h2>
        <button class="btn btn-icon modal-close" data-close-modal="modal-post-detail">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="post-detail-content"></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
