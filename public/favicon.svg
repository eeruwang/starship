<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2b4a"/>
      <stop offset="100%" stop-color="#1a1b2e"/>
    </linearGradient>
    <linearGradient id="rocket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a0a1ff"/>
      <stop offset="100%" stop-color="#7c7dff"/>
    </linearGradient>
    <linearGradient id="flame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ff9d5c"/>
      <stop offset="100%" stop-color="#ff5c87"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- stars -->
  <circle cx="5" cy="5" r="0.8" fill="#fff" opacity="0.6"/>
  <circle cx="27" cy="8" r="0.6" fill="#fff" opacity="0.4"/>
  <circle cx="8" cy="25" r="0.5" fill="#fff" opacity="0.3"/>
  <circle cx="25" cy="22" r="0.7" fill="#fff" opacity="0.5"/>
  <circle cx="4" cy="15" r="0.4" fill="#fff" opacity="0.35"/>
  <!-- rocket body -->
  <g transform="translate(16,15) rotate(-45)">
    <!-- nose cone -->
    <path d="M0,-11 C2,-11 3.5,-8 3.5,-5 L-3.5,-5 C-3.5,-8 -2,-11 0,-11Z" fill="url(#rocket)"/>
    <!-- body -->
    <rect x="-3.5" y="-5" width="7" height="10" rx="0.5" fill="url(#rocket)"/>
    <!-- window -->
    <circle cx="0" cy="-2" r="1.8" fill="#1a1b2e"/>
    <circle cx="0" cy="-2" r="1.2" fill="#5edfff" opacity="0.8"/>
    <!-- fins -->
    <path d="M-3.5,2 L-6.5,6 L-3.5,5Z" fill="#5e5fff"/>
    <path d="M3.5,2 L6.5,6 L3.5,5Z" fill="#5e5fff"/>
    <!-- flame -->
    <path d="M-2.5,5 Q-1,10 0,12 Q1,10 2.5,5Z" fill="url(#flame)" opacity="0.9"/>
    <path d="M-1.5,5 Q-0.5,9 0,10.5 Q0.5,9 1.5,5Z" fill="#ffdd57" opacity="0.8"/>
  </g>
</svg>
